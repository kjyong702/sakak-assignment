[project]
name = "health-assistant"
version = "0.1.0"
description = "건강검진 Mock API와 Ollama 로컬 LLM 기반 Q&A (LangGraph)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "httpx>=0.28",
    "langgraph>=1.2",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
